<div class="chat-assistant" [class.chat-assistant--open]="open()">
  @if (open()) {
    <section class="chat-panel" role="dialog" aria-label="Assistant Tontine Marché">
      <header class="chat-panel__header">
        <div class="chat-panel__title">
          <span class="chat-panel__avatar"><i class="pi pi-sparkles"></i></span>
          <div>
            <strong>Assistant Tontine</strong>
            <small>Posez votre question</small>
          </div>
        </div>
        <button type="button" class="chat-panel__close" (click)="close()" aria-label="Fermer">
          <i class="pi pi-times"></i>
        </button>
      </header>

      <div class="chat-panel__messages" #messagesEl>
        @for (m of messages(); track m.id) {
          <div class="chat-bubble" [ngClass]="'chat-bubble--' + m.role">
            <p>{{ m.text }}</p>
            <time>{{ m.time | date:'HH:mm' }}</time>
          </div>
        }
        @if (typing()) {
          <div class="chat-bubble chat-bubble--assistant chat-bubble--typing">
            <span></span><span></span><span></span>
          </div>
        }
      </div>

      <div class="chat-panel__suggestions">
        @for (s of suggestions; track s.label) {
          <button type="button" class="chat-chip" (click)="sendSuggestion(s.query)">{{ s.label }}</button>
        }
      </div>

      <footer class="chat-panel__input">
        <textarea
          [(ngModel)]="draft"
          name="chatDraft"
          rows="1"
          placeholder="Écrivez votre message…"
          (keydown)="onKeydown($event)"
        ></textarea>
        <button type="button" class="chat-send" (click)="send()" [disabled]="!draft.trim() || typing()" aria-label="Envoyer">
          <i class="pi pi-send"></i>
        </button>
      </footer>
    </section>
  }

  <button
    type="button"
    class="chat-fab"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-label="Ouvrir l'assistant"
  >
  <i class="pi" [class.pi-comments]="!open()" [class.pi-times]="open()"></i>
    @if (!open()) {
      <span class="chat-fab__label">Aide</span>
    }
  </button>
</div>
